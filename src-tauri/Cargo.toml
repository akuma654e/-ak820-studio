[package]
name = "ak820-studio"
version = "0.3.2"
edition = "2021"
license = "MIT"
description = "AK820 Studio - software alternativo para a tela e o RGB do AJAZZ AK820 Pro"

[lib]
name = "ak820_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ak820-core = { path = "../crates/ak820-core" }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
cpal = "0.16"
realfft = "3.5"
sysinfo = { version = "0.37", default-features = false, features = ["system"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[target.'cfg(windows)'.dependencies]
hidapi = { version = "2.6", default-features = false, features = ["windows-native"] }
xcap = "0.7"

[target.'cfg(not(windows))'.dependencies]
hidapi = { version = "2.6" }
